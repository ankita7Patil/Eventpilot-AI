<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventPilot AI — Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(16,185,129,0.1) 0%, transparent 50%);
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      backdrop-filter: blur(20px);
    }

    .logo {
      font-size: 36px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 36px;
    }

    .subtitle span {
      color: #4ade80;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #6366f1;
    }

    input::placeholder { color: #555; }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 10px;
      padding: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #444;
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    .notify-btn {
      width: 100%;
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.3);
      border-radius: 10px;
      padding: 12px;
      color: #4ade80;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .notify-btn:hover { background: rgba(74,222,128,0.2); }

    .features {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .feature-tag {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: #888;
    }

    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: #f87171;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1>EventPilot AI</h1>
    <p class="subtitle">Never miss a <span>deadline</span> again</p>

    <div class="error" id="errorMsg"></div>

    <div class="input-group">
      <label>Your Name</label>
      <input type="text" id="nameInput" placeholder="e.g. Priya Sharma" />
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="you@example.com" />
    </div>

    <button class="btn" onclick="signIn()">🚀 Get Started — It's Free</button>

    <div class="divider">also</div>

    <button class="notify-btn" onclick="enableNotifications()">
      🔔 Enable Deadline Notifications
    </button>

    <div class="features">
      <span class="feature-tag">✓ Multi-agent AI</span>
      <span class="feature-tag">✓ Real-time alerts</span>
      <span class="feature-tag">✓ Any event link</span>
      <span class="feature-tag">✓ Free forever</span>
    </div>
  </div>

  <script>
    // If already signed in, redirect
    if (localStorage.getItem("EP_USER_NAME") && localStorage.getItem("EP_USER_EMAIL")) {
      window.location.href = "index.html";
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.style.display = "block";
    }

    function signIn() {
      const name = document.getElementById("nameInput").value.trim();
      const email = document.getElementById("emailInput").value.trim();

      if (!name) return showError("Please enter your name.");
      if (!email || !email.includes("@")) return showError("Please enter a valid email.");

      localStorage.setItem("EP_USER_NAME", name);
      localStorage.setItem("EP_USER_EMAIL", email);

      enableNotifications();
      window.location.href = "index.html";
    }

    async function enableNotifications() {
      if ("Notification" in window) {
        const perm = await Notification.requestPermission();
        if (perm === "granted") {
          new Notification("EventPilot AI ⚡", {
            body: "Deadline alerts enabled! Paste any event link to start tracking.",
          });
        }
      }
    }

    // Allow Enter key
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") signIn();
    });
  </script>
</body>
</html>
